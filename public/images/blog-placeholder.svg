<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#F8F9FA"/>
  
  <!-- Image Icon -->
  <g transform="translate(360, 160)">
    <!-- Image frame -->
    <rect x="0" y="0" width="80" height="60" rx="4" fill="#E5E7EB" stroke="#D1D5DB" stroke-width="2"/>
    
    <!-- Mountain/landscape icon -->
    <path d="M10 45 L25 30 L35 40 L50 25 L70 45 L70 50 L10 50 Z" fill="#9CA3AF"/>
    
    <!-- Sun/circle -->
    <circle cx="60" cy="20" r="8" fill="#9CA3AF"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="260" font-family="Arial, sans-serif" font-size="18" fill="#6B7280" text-anchor="middle" font-weight="500">Blog Post Image</text>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="14" fill="#9CA3AF" text-anchor="middle">No image available</text>
</svg>
