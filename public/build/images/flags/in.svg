<svg xmlns="http://www.w3.org/2000/svg" id="flag-icons-in" viewBox="0 0 640 480">
  <!-- Indian Flag Colors -->
  <rect width="640" height="160" y="0" fill="#ff9933" />
  <rect width="640" height="160" y="160" fill="#ffffff" />
  <rect width="640" height="160" y="320" fill="#138808" />

  <!-- Ashoka Chakra -->
  <circle cx="320" cy="240" r="40" stroke="#000080" stroke-width="4" fill="none" />
  <g transform="translate(320,240)" stroke="#000080" stroke-width="2">
    <!-- 24 spokes -->
    <g>
      <line y1="-40" y2="40" transform="rotate(0)" />
      <line y1="-40" y2="40" transform="rotate(15)" />
      <line y1="-40" y2="40" transform="rotate(30)" />
      <line y1="-40" y2="40" transform="rotate(45)" />
      <line y1="-40" y2="40" transform="rotate(60)" />
      <line y1="-40" y2="40" transform="rotate(75)" />
      <line y1="-40" y2="40" transform="rotate(90)" />
      <line y1="-40" y2="40" transform="rotate(105)" />
      <line y1="-40" y2="40" transform="rotate(120)" />
      <line y1="-40" y2="40" transform="rotate(135)" />
      <line y1="-40" y2="40" transform="rotate(150)" />
      <line y1="-40" y2="40" transform="rotate(165)" />
      <line y1="-40" y2="40" transform="rotate(180)" />
      <line y1="-40" y2="40" transform="rotate(195)" />
      <line y1="-40" y2="40" transform="rotate(210)" />
      <line y1="-40" y2="40" transform="rotate(225)" />
      <line y1="-40" y2="40" transform="rotate(240)" />
      <line y1="-40" y2="40" transform="rotate(255)" />
      <line y1="-40" y2="40" transform="rotate(270)" />
      <line y1="-40" y2="40" transform="rotate(285)" />
      <line y1="-40" y2="40" transform="rotate(300)" />
      <line y1="-40" y2="40" transform="rotate(315)" />
      <line y1="-40" y2="40" transform="rotate(330)" />
      <line y1="-40" y2="40" transform="rotate(345)" />
    </g>
  </g>
</svg>